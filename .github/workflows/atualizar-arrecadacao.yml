name: Atualizar arrecadação da CIP

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-arrecadacao-cip
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Atualizar arrecadação no SICONFI
        env:
          CIP_BASE: coleta
          CIP_REFRESH: "1"
        run: python coleta/coleta_arrecadacao.py

      - name: Regenerar o site
        env:
          CIP_BASE: coleta
          CIP_SITE: "."
          CIP_ONLY: "0"
        run: python coleta/render_site.py

      - name: Rodar testes
        run: python -m unittest coleta.test_cobranca

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coleta/arrecadacao_cip.json arrecadacao/index.html index.html cip distribuidora assets/style.css
          if git diff --cached --quiet; then
            echo "Sem alterações para commitar."
            exit 0
          fi
          git commit -m "chore: atualiza arrecadação da CIP ($(date +%Y-%m))"
          git push origin HEAD:main
